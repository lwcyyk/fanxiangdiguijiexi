[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolver-identity-prototype"
version = "0.1.0"
description = "Out-of-band recursive resolver identity verification prototype"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "cryptography>=48.0.1,<49",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pip-audit>=2.7,<3",
  "pip-tools>=7.4,<8",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]
web3 = ["web3>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["resolver_identity"]
omit = [
  "*/app.py",
  "*/runtime.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
