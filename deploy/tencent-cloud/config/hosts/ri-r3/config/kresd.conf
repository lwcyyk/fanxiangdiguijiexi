-- Managed by Resolver Identity Tencent Cloud lab. Validate before activation.
net.listen('0.0.0.0', 1053, { kind = 'dns' })
cache.size = 256 * MB
modules = { 'hints > iterate', 'stats', 'policy' }
-- Route the lab test zone through the identity chain (R1-wrapper -> R2 -> R3 -> auth DNS).
-- .invalid is an RFC 6761 locally-served zone: kresd answers NXDOMAIN from local data and
-- never reaches the forwarder unless PASSTHRU_LEGACY is set. STUB forwards without DNSSEC
-- validation (no DS trust-chain walk), which the fake .invalid TLD would otherwise break.
-- Both actions must run inside ONE rule because policy.evaluate runs only the first match.
local stub = policy.STUB({ '10.206.16.13' })
local passthru = policy.FLAGS('PASSTHRU_LEGACY')
policy.add(policy.suffix(function(state, req)
    stub(state, req)
    passthru(state, req)
    return state
  end, { todname('ri-test.invalid.') }))
