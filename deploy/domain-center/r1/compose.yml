name: ${RI_FIELD_COMPOSE_PROJECT:-ri-r1}

x-runtime: &runtime
  image: ${RI_IMAGE:?pin unified RC15 stable Rust image digest including Producer reconnect}
  user: "${RI_RUNTIME_UID:-10002}:${RI_RUNTIME_GID:-10002}"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: ${RI_DOCKER_LOG_MAX_SIZE:-50m}
      max-file: ${RI_DOCKER_LOG_MAX_FILES:-5}

services:
  resolver:
    image: ${RI_KNOT_IMAGE:-offline/resolver-identity/knot@sha256:61e01beae33fd4140acdad907617e59da366a211c1ff6c116433fd2031bbdcc8}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    command: ["-n", "-c", "/run/config/kresd.conf", "/var/cache/knot-resolver"]
    environment:
      RI_KNOT_TRACE_HOOK_SOCKET: /run/resolver-identity/trace/knot-hook.sock
      RI_TRACE_ACK_TIMEOUT_MS: ${RI_TRACE_ACK_TIMEOUT_MS:-100}
    group_add: ["${RI_TRACE_PRODUCER_GID:?required}"]
    volumes:
      - ${RI_RESOLVER_CONFIG_FILE:?required}:/run/config/kresd.conf:ro
      - ${RI_TRACE_SOCKET_HOST_DIR:?required}:/run/resolver-identity/trace
      - ${RI_FIELD_DATA_DIR:?required}/knot-cache:/var/cache/knot-resolver
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "${RI_RESOLVER_BIND_ADDRESS:?required}:53:1053/udp"
      - "${RI_RESOLVER_BIND_ADDRESS:?required}:53:1053/tcp"
    networks: [resolver-egress]
    logging:
      driver: json-file
      options:
        max-size: ${RI_DOCKER_LOG_MAX_SIZE:-50m}
        max-file: ${RI_DOCKER_LOG_MAX_FILES:-5}

  trace-producer:
    <<: *runtime
    command: ["/usr/local/bin/ri-knot-trace-producer"]
    environment:
      RI_KNOT_TRACE_HOOK_SOCKET: /run/resolver-identity/trace/knot-hook.sock
      RI_KNOT_TRACE_HOOK_SOCKET_MODE: "0660"
      RI_KNOT_TRACE_EXPECTED_UID: ${RI_KNOT_RESOLVER_UID:-10003}
      RI_TRACE_SOCKET: /run/resolver-identity/trace/events.sock
      RI_AGENT_SERVER_ID: ${RI_AGENT_SERVER_ID:?required}
      RI_TRACE_MAX_CONTEXTS: ${RI_TRACE_MAX_CONTEXTS:-65536}
      RI_TRACE_ACK_TIMEOUT_MS: ${RI_TRACE_ACK_TIMEOUT_MS:-100}
    volumes:
      - ${RI_TRACE_SOCKET_HOST_DIR:?required}:/run/resolver-identity/trace
    network_mode: none

  registry-sync:
    <<: *runtime
    command: ["/usr/local/bin/ri-registry-sync"]
    environment:
      RI_ENVIRONMENT: production
      RI_DATABASE: /var/lib/resolver-identity/evidence-v2.db
      RI_IDENTITIES_FILE: /run/config/identities-v2.json
      RI_ISSUER_KEYS_FILE: /run/config/issuer-keys.json
      RI_CHAIN_ADAPTER: norn
      RI_CHAIN_RPC_URLS: ${RI_CHAIN_RPC_URLS:?two mTLS Norn read endpoints required}
      RI_CHAIN_ID: ${RI_CHAIN_ID:?required}
      RI_NORN_GENESIS_BLOCK_HASH: ${RI_NORN_GENESIS_BLOCK_HASH:?required}
      RI_CHAIN_REGISTRY_ADDRESS: ${RI_CHAIN_REGISTRY_ADDRESS:?required}
      RI_NORN_REGISTRY_KEY: ${RI_NORN_REGISTRY_KEY:?required}
      RI_NORN_SIGNER_ISSUER: ${RI_NORN_SIGNER_ISSUER:?required}
      RI_NORN_SIGNER_KEY_ID: ${RI_NORN_SIGNER_KEY_ID:?required}
      RI_CHAIN_REGISTRY_SCHEMA_HASH: ${RI_CHAIN_REGISTRY_SCHEMA_HASH:?required}
      RI_CHAIN_CONFIRMATIONS: ${RI_CHAIN_CONFIRMATIONS:-12}
      RI_NORN_REGISTRY_START_HEIGHT: ${RI_NORN_REGISTRY_START_HEIGHT:-0}
      RI_NORN_MAX_SCAN_BLOCKS: ${RI_NORN_MAX_SCAN_BLOCKS:-100000}
      RI_NORN_TLS_CA_FILE: /run/norn-tls/ca.crt
      RI_NORN_TLS_CLIENT_CERT_FILE: /run/norn-tls/client.crt
      RI_NORN_TLS_CLIENT_KEY_FILE: /run/norn-tls/client.key
      RI_RPC_MAX_RESPONSE_BYTES: ${RI_RPC_MAX_RESPONSE_BYTES:-4194304}
      RI_REGISTRY_POLL_INTERVAL_MS: ${RI_REGISTRY_POLL_INTERVAL_MS:-2000}
      RI_REGISTRY_SYNC_ONCE: "false"
      RI_REGISTRY_MONITORING_BIND: 0.0.0.0:9109
    volumes:
      - ${RI_FIELD_DATA_DIR:?required}:/var/lib/resolver-identity
      - ${RI_IDENTITIES_FILE:?required}:/run/config/identities-v2.json:ro
      - ${RI_ISSUER_KEYS_FILE:?required}:/run/config/issuer-keys.json:ro
      - ${RI_NORN_CLIENT_TLS_DIR:?required}:/run/norn-tls:ro
    ports:
      - "${RI_MANAGEMENT_BIND_ADDRESS:?required}:9109:9109/tcp"
    networks: [registry-egress]

  agent:
    <<: *runtime
    command: ["/usr/local/bin/ri-agent"]
    environment:
      RI_ENVIRONMENT: production
      RI_VERIFICATION_MODE: controlled-strict
      RI_ISSUER_KEYS_FILE: /run/config/issuer-keys.json
      RI_AGENT_BIND: 0.0.0.0:8443
      RI_AGENT_SERVER_ID: ${RI_AGENT_SERVER_ID:?required}
      RI_AGENT_KEY_ID: ${RI_AGENT_KEY_ID:?required}
      RI_AGENT_PRIVATE_KEY_FILE: /run/secrets/agent_private_key
      RI_TRACE_INGEST_TOKEN_FILE: /run/secrets/trace_ingest_token
      RI_AGENT_WRAPPER_TOKEN_FILE: /run/secrets/agent_wrapper_token
      RI_AGENT_PEER_CREDENTIALS_FILE: /run/secrets/agent_peer_credentials.json
      RI_DATABASE: /var/lib/resolver-identity/evidence-v2.db
      RI_REGISTRY_MAX_STALENESS_SECONDS: "45"
      RI_TRACE_WAIT_MILLIS: ${RI_TRACE_WAIT_MILLIS:-5000}
      RI_AGENT_TLS_CERT_FILE: /run/agent-tls/agent.crt
      RI_AGENT_TLS_KEY_FILE: /run/agent-tls/agent.key
      RI_AGENT_TLS_CLIENT_CA_FILE: /run/agent-tls/client-ca.crt
      RI_AGENT_TLS_CLIENT_CERT_FILE: /run/agent-tls/agent-client.crt
      RI_AGENT_TLS_CLIENT_KEY_FILE: /run/agent-tls/agent-client.key
      RI_AGENT_TLS_CA_FILE: /run/agent-tls/agent-ca.crt
    volumes:
      - ${RI_FIELD_DATA_DIR:?required}:/var/lib/resolver-identity
      - ${RI_ISSUER_KEYS_FILE:?required}:/run/config/issuer-keys.json:ro
      - ${RI_RESOLVER_SECRET_DIR:?required}:/run/secrets:ro
      - ${RI_AGENT_TLS_DIR:?required}:/run/agent-tls:ro
    ports:
      - "${RI_MANAGEMENT_BIND_ADDRESS:?required}:8443:8443/tcp"
    networks: [link-control, agent-egress]
    depends_on:
      registry-sync:
        condition: service_started

  trace-adapter:
    <<: *runtime
    command: ["/usr/local/bin/ri-trace-adapter"]
    environment:
      RI_ENVIRONMENT: production
      RI_TRACE_SOCKET: /run/resolver-identity/trace/events.sock
      RI_TRACE_PRODUCER_UID: ${RI_TRACE_PRODUCER_UID:?required}
      RI_DATABASE: /var/lib/resolver-identity/evidence-v2.db
      RI_TRACE_SPOOL_DATABASE: /var/lib/resolver-identity/trace-spool.db
      RI_TRACE_AGENT_URL: https://agent:8443
      RI_TRACE_INGEST_TOKEN_FILE: /run/secrets/trace_ingest_token
      RI_TRACE_MONITORING_BIND: 0.0.0.0:9110
      RI_TRACE_CACHE_PROVENANCE_WAIT_MS: ${RI_TRACE_CACHE_PROVENANCE_WAIT_MS:-2000}
      RI_TRACE_TLS_CLIENT_CERT_FILE: /run/agent-tls/trace-client.crt
      RI_TRACE_TLS_CLIENT_KEY_FILE: /run/agent-tls/trace-client.key
      RI_TRACE_TLS_CA_FILE: /run/agent-tls/agent-ca.crt
    group_add: ["${RI_TRACE_PRODUCER_GID:?required}"]
    volumes:
      - ${RI_TRACE_SOCKET_HOST_DIR:?required}:/run/resolver-identity/trace
      - ${RI_FIELD_DATA_DIR:?required}:/var/lib/resolver-identity
      - ${RI_RESOLVER_SECRET_DIR:?required}:/run/secrets:ro
      - ${RI_AGENT_TLS_DIR:?required}:/run/agent-tls:ro
    ports:
      - "${RI_MANAGEMENT_BIND_ADDRESS:?required}:9110:9110/tcp"
    networks: [link-control]
    depends_on:
      agent:
        condition: service_started

  wrapper:
    <<: *runtime
    command: ["/usr/local/bin/ri-wrapper"]
    environment:
      RI_ENVIRONMENT: production
      RI_VERIFICATION_MODE: controlled-strict
      RI_ISSUER_KEYS_FILE: /run/config/issuer-keys.json
      RI_WRAPPER_UDP_BIND: 0.0.0.0:1053
      RI_WRAPPER_TCP_BIND: 0.0.0.0:1053
      RI_WRAPPER_MONITORING_BIND: 0.0.0.0:9108
      RI_WRAPPER_AGENT_URL: https://agent:8443
      RI_WRAPPER_AGENT_TOKEN_FILE: /run/secrets/agent_wrapper_token
      RI_DATABASE: /var/lib/resolver-identity/evidence-v2.db
      RI_WRAPPER_UPSTREAMS: ${RI_WRAPPER_UPSTREAMS:?local resolver TCP upstream required}
      RI_REGISTRY_MAX_STALENESS_SECONDS: "45"
      RI_WRAPPER_AGENT_TIMEOUT_MS: ${RI_WRAPPER_AGENT_TIMEOUT_MS:-7500}
      RI_WRAPPER_MAX_CONCURRENT_VERIFICATIONS: ${RI_WRAPPER_MAX_CONCURRENT_VERIFICATIONS:-32}
      RI_WRAPPER_TLS_CLIENT_CERT_FILE: /run/agent-tls/wrapper-client.crt
      RI_WRAPPER_TLS_CLIENT_KEY_FILE: /run/agent-tls/wrapper-client.key
      RI_WRAPPER_TLS_CA_FILE: /run/agent-tls/agent-ca.crt
    volumes:
      - ${RI_FIELD_DATA_DIR:?required}:/var/lib/resolver-identity
      - ${RI_ISSUER_KEYS_FILE:?required}:/run/config/issuer-keys.json:ro
      - ${RI_RESOLVER_SECRET_DIR:?required}:/run/secrets:ro
      - ${RI_AGENT_TLS_DIR:?required}:/run/agent-tls:ro
    ports:
      - "${DNS_BIND_ADDRESS:?required}:1053:1053/udp"
      - "${DNS_BIND_ADDRESS:?required}:1053:1053/tcp"
      - "${RI_MANAGEMENT_BIND_ADDRESS:?required}:9108:9108/tcp"
    networks: [dns-ingress, link-control, resolver-egress]
    depends_on:
      resolver:
        condition: service_started
      agent:
        condition: service_started

networks:
  dns-ingress:
  link-control:
    internal: true
  resolver-egress:
  agent-egress:
  registry-egress:
    external: true
    name: ${RI_FIELD_NETWORK:-ri-norn-field}
