x-runtime: &runtime
  image: ${RI_IMAGE:?pin the approved RC15 resolver-identity Rust image}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 512m
  cpus: 2.0
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  logging:
    driver: json-file
    options:
      max-size: ${RI_DOCKER_LOG_MAX_SIZE:-20m}
      max-file: ${RI_DOCKER_LOG_MAX_FILES:-3}

services:
  registry-sync:
    <<: *runtime
    command: ["/usr/local/bin/ri-registry-sync"]
    environment:
      RI_ENVIRONMENT: production
      RI_DATABASE: /var/lib/resolver-identity/evidence-v2.db
      RI_IDENTITIES_FILE: /run/config/identities-v2.json
      RI_ISSUER_KEYS_FILE: /run/config/issuer-keys.json
      RI_CHAIN_ADAPTER: norn
      RI_CHAIN_RPC_URLS: ${RI_CHAIN_RPC_URLS:?required}
      RI_CHAIN_ID: ${RI_CHAIN_ID:?required}
      RI_NORN_GENESIS_BLOCK_HASH: ${RI_NORN_GENESIS_BLOCK_HASH:?required}
      RI_CHAIN_REGISTRY_ADDRESS: ${RI_CHAIN_REGISTRY_ADDRESS:?required}
      RI_NORN_REGISTRY_KEY: ${RI_NORN_REGISTRY_KEY:?required}
      RI_NORN_SIGNER_ISSUER: ${RI_NORN_SIGNER_ISSUER:?required}
      RI_NORN_SIGNER_KEY_ID: ${RI_NORN_SIGNER_KEY_ID:?required}
      RI_CHAIN_REGISTRY_SCHEMA_HASH: ${RI_CHAIN_REGISTRY_SCHEMA_HASH:?required}
      RI_CHAIN_CONFIRMATIONS: ${RI_CHAIN_CONFIRMATIONS:-12}
      RI_NORN_REGISTRY_START_HEIGHT: ${RI_NORN_REGISTRY_START_HEIGHT:-0}
      RI_NORN_MAX_SCAN_BLOCKS: ${RI_NORN_MAX_SCAN_BLOCKS:-100000}
      RI_NORN_TLS_CA_FILE: /run/norn-tls/ca.crt
      RI_NORN_TLS_CLIENT_CERT_FILE: /run/norn-tls/client.crt
      RI_NORN_TLS_CLIENT_KEY_FILE: /run/norn-tls/client.key
      RI_RPC_MAX_RESPONSE_BYTES: ${RI_RPC_MAX_RESPONSE_BYTES:-4194304}
      RI_REGISTRY_POLL_INTERVAL_MS: ${RI_REGISTRY_POLL_INTERVAL_MS:-2000}
      RI_REGISTRY_SYNC_ONCE: "false"
      RI_REGISTRY_MONITORING_BIND: ${RI_AUTHDNS_MANAGEMENT_IP:?required}:9109
    volumes:
      - ${RI_FIELD_DATA_DIR:?required}:/var/lib/resolver-identity
      - ./config/identities-v2.json:/run/config/identities-v2.json:ro
      - ./config/issuer-keys.json:/run/config/issuer-keys.json:ro
      - ${RI_NORN_CLIENT_TLS_DIR:?required}:/run/norn-tls:ro
    network_mode: host

  agent:
    <<: *runtime
    command: ["/usr/local/bin/ri-agent"]
    environment:
      RI_ENVIRONMENT: production
      RI_VERIFICATION_MODE: controlled-strict
      RI_DATABASE: /var/lib/resolver-identity/evidence-v2.db
      RI_ISSUER_KEYS_FILE: /run/config/issuer-keys.json
      RI_AGENT_BIND: ${RI_AUTHDNS_MANAGEMENT_IP:?required}:8443
      RI_AGENT_SERVER_ID: ${RI_AGENT_SERVER_ID:?required}
      RI_AGENT_KEY_ID: ${RI_AGENT_KEY_ID:?required}
      RI_AGENT_PRIVATE_KEY_FILE: /run/secrets/agent_private_key
      RI_TRACE_INGEST_TOKEN_FILE: /run/secrets/trace_ingest_token
      RI_AGENT_WRAPPER_TOKEN_FILE: /run/secrets/agent_wrapper_token
      RI_AGENT_PEER_CREDENTIALS_FILE: /run/secrets/agent_peer_credentials.json
      RI_REGISTRY_MAX_STALENESS_SECONDS: ${RI_REGISTRY_MAX_STALENESS_SECONDS:-45}
      RI_TRACE_WAIT_MILLIS: ${RI_TRACE_WAIT_MILLIS:-5000}
      RI_AGENT_TLS_CERT_FILE: /run/agent-tls/agent.crt
      RI_AGENT_TLS_KEY_FILE: /run/agent-tls/agent.key
      RI_AGENT_TLS_CLIENT_CA_FILE: /run/agent-tls/client-ca.crt
      RI_AGENT_TLS_CLIENT_CERT_FILE: /run/agent-tls/agent-client.crt
      RI_AGENT_TLS_CLIENT_KEY_FILE: /run/agent-tls/agent-client.key
      RI_AGENT_TLS_CA_FILE: /run/agent-tls/agent-ca.crt
    volumes:
      - ${RI_FIELD_DATA_DIR:?required}:/var/lib/resolver-identity
      - ./config/issuer-keys.json:/run/config/issuer-keys.json:ro
      - ${RI_RESOLVER_SECRET_DIR:?required}:/run/secrets:ro
      - ${RI_AGENT_TLS_DIR:?required}:/run/agent-tls:ro
    network_mode: host
    depends_on:
      registry-sync:
        condition: service_started

  authority-proxy:
    <<: *runtime
    user: "0:0"
    entrypoint:
      - /usr/bin/setpriv
      - --reuid=10002
      - --regid=10002
      - --clear-groups
      - --inh-caps=+net_bind_service
      - --ambient-caps=+net_bind_service
      - --bounding-set=-setuid,-setgid,-setpcap
    command: ["/usr/local/bin/ri-authority-proxy"]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, SETPCAP]
    environment:
      RI_AUTHORITY_PUBLIC_BIND: ${RI_AUTHORITY_PUBLIC_BIND:?required}
      RI_AUTHORITY_MONITORING_BIND: 127.0.0.1:9111
      RI_AUTHORITY_BACKEND: ${RI_AUTHORITY_BACKEND:-127.0.0.1:5353}
      RI_AUTHORITY_SERVER_ID: ${RI_AGENT_SERVER_ID:?required}
      RI_AUTHORITY_AGENT_URL: ${RI_AUTHORITY_AGENT_URL:?required}
      RI_TRACE_INGEST_TOKEN_FILE: /run/secrets/trace_ingest_token
      RI_AUTHORITY_TLS_CLIENT_CERT_FILE: /run/agent-tls/authority-client.crt
      RI_AUTHORITY_TLS_CLIENT_KEY_FILE: /run/agent-tls/authority-client.key
      RI_AUTHORITY_TLS_CA_FILE: /run/agent-tls/agent-ca.crt
      RI_AUTHORITY_BACKEND_TIMEOUT_MS: ${RI_AUTHORITY_BACKEND_TIMEOUT_MS:-750}
      RI_AUTHORITY_AGENT_TIMEOUT_MS: ${RI_AUTHORITY_AGENT_TIMEOUT_MS:-750}
      RI_AUTHORITY_IO_TIMEOUT_MS: ${RI_AUTHORITY_IO_TIMEOUT_MS:-2000}
      RI_AUTHORITY_MAX_AGENT_RESPONSE_BYTES: ${RI_AUTHORITY_MAX_AGENT_RESPONSE_BYTES:-1048576}
      RI_AUTHORITY_MAX_UDP_QUERIES: ${RI_AUTHORITY_MAX_UDP_QUERIES:-4096}
      RI_AUTHORITY_MAX_TCP_CONNECTIONS: ${RI_AUTHORITY_MAX_TCP_CONNECTIONS:-1024}
    volumes:
      - ${RI_RESOLVER_SECRET_DIR:?required}/trace_ingest_token:/run/secrets/trace_ingest_token:ro
      - ${RI_AGENT_TLS_DIR:?required}/authority-client.crt:/run/agent-tls/authority-client.crt:ro
      - ${RI_AGENT_TLS_DIR:?required}/authority-client.key:/run/agent-tls/authority-client.key:ro
      - ${RI_AGENT_TLS_DIR:?required}/agent-ca.crt:/run/agent-tls/agent-ca.crt:ro
    network_mode: host
    depends_on:
      agent:
        condition: service_started
