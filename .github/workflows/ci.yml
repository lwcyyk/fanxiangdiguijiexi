name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[dev,web3]'
      - run: ruff check src tests tools
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: python -m compileall -q src tests tools
      - if: matrix.python-version == '3.13'
        run: pip-audit -r requirements-production.lock --require-hashes
      - if: matrix.python-version == '3.13'
        run: pip-audit -r requirements-production.lock --require-hashes --format cyclonedx-json --output resolver-identity-sbom.cdx.json
      - if: matrix.python-version == '3.13'
        run: |
          cp requirements-production.lock /tmp/requirements-production.hashed.lock
          python -m piptools compile pyproject.toml --extra web3 --strip-extras --generate-hashes --no-upgrade --output-file /tmp/requirements-production.hashed.lock --quiet
          diff -u requirements-production.lock /tmp/requirements-production.hashed.lock
      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolver-identity-sbom
          path: resolver-identity-sbom.cdx.json
          if-no-files-found: error

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
      - run: forge test -vvv
        working-directory: contracts

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          cp .env.legacy-python.example .env.legacy-python
          cp deploy/issuer-keys.example.json deploy/issuer-keys.json
          mkdir -p deploy/secrets
          printf 'placeholder' > deploy/secrets/admin_api_token
          printf 'placeholder' > deploy/secrets/agent_private_key_b64
          printf 'placeholder' > deploy/secrets/issuer_private_key_b64
          printf 'placeholder' > deploy/secrets/web3_private_key
          docker compose --env-file .env.legacy-python -f docker-compose.legacy-python.yml config --quiet
      - run: |
          mkdir -p docker/state
          touch docker/state/agent-r1.env docker/state/agent-r2.env docker/state/web3.env
          docker compose -f docker-compose.multi-resolver.yml config --quiet
      - run: |
          cp deploy/link/identities-v2.example.json deploy/link/identities-v2.json
          mkdir -p deploy/link/secrets deploy/link/tls
          printf 'placeholder' > deploy/link/secrets/agent_private_key
          printf 'placeholder' > deploy/link/secrets/trace_ingest_token
          printf 'placeholder' > deploy/link/secrets/agent_wrapper_token
          printf 'placeholder' > deploy/link/secrets/agent_peer_token
          docker compose --env-file deploy/link/.env.example -f deploy/link/docker-compose.yml config --quiet

  legacy-python-image:
    name: legacy Python compatibility image
    runs-on: ubuntu-latest
    needs: [python, solidity, compose]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --pull --file docker/Dockerfile.legacy-python --tag resolver-identity-legacy:ci .
      - name: Verify legacy image policy
        run: |
          test "$(docker image inspect resolver-identity-legacy:ci --format '{{.Config.User}}')" = resolver
          docker run --rm --entrypoint python resolver-identity-legacy:ci -c "import cryptography, resolver_identity, web3"
          docker run --rm --entrypoint python resolver-identity-legacy:ci -c "import importlib.metadata as m; assert not ({'pip', 'setuptools'} & {d.metadata['Name'].lower() for d in m.distributions()})"
          docker run --rm --entrypoint python resolver-identity-legacy:ci tools/db_admin.py --help
          docker run --rm --entrypoint python resolver-identity-legacy:ci -c "from pathlib import Path; assert not Path('tools/run_security_experiments.py').exists()"

  rust-production-image:
    runs-on: ubuntu-latest
    needs: [rust, compose]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --pull --file docker/Dockerfile.rust --tag resolver-identity-rust:ci .
      - name: Verify Rust production image policy
        run: |
          test "$(docker image inspect resolver-identity-rust:ci --format '{{.Config.User}}')" = resolver-rust
          for binary in ri-agent ri-wrapper ri-trace-adapter ri-registry-sync; do
            docker run --rm --entrypoint /bin/sh resolver-identity-rust:ci -c "test -x /usr/local/bin/$binary"
          done
