name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - run: ruff check src tests tools
      - run: python3 -m pytest -q
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: python -m compileall -q src tests tools
      - run: pip-audit -r requirements-production.lock --require-hashes
      - run: pip-audit -r requirements-production.lock --require-hashes --format cyclonedx-json --output resolver-identity-sbom.cdx.json
      - name: Verify Python lock files are unchanged
        run: |
          lock_dir="$(mktemp --directory)"
          trap 'rm -rf "$lock_dir"' EXIT
          cp pyproject.toml requirements-production.lock requirements-ci.lock "$lock_dir/"
          (
            cd "$lock_dir"
            python -m piptools compile pyproject.toml --extra web3 --strip-extras --generate-hashes --no-upgrade --output-file requirements-production.lock --quiet
            python -m piptools compile pyproject.toml --extra dev --extra web3 --strip-extras --generate-hashes --allow-unsafe --no-upgrade --output-file requirements-ci.lock --quiet
          )
          diff -u requirements-production.lock "$lock_dir/requirements-production.lock"
          diff -u requirements-ci.lock "$lock_dir/requirements-ci.lock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolver-identity-sbom
          path: resolver-identity-sbom.cdx.json
          if-no-files-found: error

  solidity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build
        working-directory: contracts
      - run: forge test -vvv
        working-directory: contracts

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Legacy Compose compatibility
        run: |
          cp .env.legacy-python.example .env.legacy-python
          cp deploy/issuer-keys.example.json deploy/issuer-keys.json
          mkdir -p deploy/secrets
          printf 'placeholder' > deploy/secrets/admin_api_token
          printf 'placeholder' > deploy/secrets/agent_private_key_b64
          printf 'placeholder' > deploy/secrets/issuer_private_key_b64
          printf 'placeholder' > deploy/secrets/web3_private_key
          docker compose --env-file .env.legacy-python -f docker-compose.legacy-python.yml config --quiet
          mkdir -p docker/state
          touch docker/state/agent-r1.env docker/state/agent-r2.env docker/state/web3.env
          docker compose -f docker-compose.multi-resolver.yml config --quiet
      - name: EVM, Norn, and External production Compose
        run: |
          cp deploy/link/identities-v2.example.json deploy/link/identities-v2.json
          mkdir -p deploy/link/secrets deploy/link/tls
          printf 'placeholder' > deploy/link/secrets/agent_private_key
          printf 'placeholder' > deploy/link/secrets/trace_ingest_token
          printf 'placeholder' > deploy/link/secrets/agent_wrapper_token
          printf 'placeholder' > deploy/link/secrets/agent_peer_token
          compose() {
            docker run --rm \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              docker@sha256:4fa0ee1f3a7e4354c4ea34558b6d4ee32859baf4973d4c8ccc8e7fe3dd730c04 \
              docker compose "$@"
          }
          test "$(compose version --short)" = "5.0.0"
          compose --env-file deploy/link/.env.example -f deploy/link/docker-compose.yml config --quiet
          compose --env-file deploy/link/.env.norn.example -f deploy/link/docker-compose.yml config --quiet
          compose --env-file deploy/link/.env.external.example -f deploy/link/docker-compose.yml config --quiet

  field-delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install hash-locked Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Install fixed ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck=0.9.0-1
          test "$(shellcheck --version | awk '/^version:/ {print $2}')" = "0.9.0"
      - name: Validate templates and package lifecycle tests
        run: |
          python3 tools/manage_norn_field_delivery.py validate \
            --inventory deploy/field/inventory.example.yaml --template
          python3 tools/run_norn_field_acceptance.py --help
          python3 -m pytest -q tests/unit/test_norn_field_delivery.py
          shellcheck \
            deploy/field/common/*.sh \
            deploy/field/management/*.sh \
            deploy/field/norn-node/*.sh \
            deploy/field/resolver-link/*.sh \
            scripts/field-delivery/*.sh
      - name: Render all field Compose templates
        run: |
          for kind in management norn-node resolver-link; do
            docker compose \
              --env-file "deploy/field/${kind}/.env.example" \
              -f "deploy/field/${kind}/docker-compose.yml" \
              config --quiet
          done

  easy-installer:
    name: easy installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install hash-locked Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Validate deterministic offline installer
        run: |
          python3 -m pytest -q tests/unit/test_domain_center_easy_installer.py tests/unit/test_norn_field_delivery.py
          python3 tools/build_domain_center_site_bundle.py self-test
          python3 installer/wizard.py --help >/dev/null
          python3 -m compileall -q installer deploy/easy-install/product-kit tools/build_domain_center_site_bundle.py
          find deploy/easy-install/product-kit installer -type f -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n
      - name: Verify production safety declarations
        run: |
          ! grep -R -E 'real_server_deployed["[:space:]]*:[[:space:]]*true|production_traffic_enabled["[:space:]]*:[[:space:]]*true' \
            deploy/easy-install installer tools/build_domain_center_site_bundle.py docs/easy-install

  legacy-python-image:
    name: legacy Python compatibility image
    runs-on: ubuntu-24.04
    needs: [python, solidity, compose]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --pull --file docker/Dockerfile.legacy-python --tag resolver-identity-legacy:ci .
      - name: Verify legacy image policy
        run: |
          test "$(docker image inspect resolver-identity-legacy:ci --format '{{.Config.User}}')" = resolver
          docker run --rm --entrypoint python resolver-identity-legacy:ci -c "import cryptography, resolver_identity, web3"
          docker run --rm --entrypoint python resolver-identity-legacy:ci -c "import importlib.metadata as m; assert not ({'pip', 'setuptools'} & {d.metadata['Name'].lower() for d in m.distributions()})"
          docker run --rm --entrypoint python resolver-identity-legacy:ci tools/db_admin.py --help
          docker run --rm --entrypoint python resolver-identity-legacy:ci -c "from pathlib import Path; assert not Path('tools/run_security_experiments.py').exists()"

  rust-production-image:
    runs-on: ubuntu-24.04
    needs: [rust, compose]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --pull --file docker/Dockerfile.rust --tag resolver-identity-rust:ci .
      - name: Verify Rust production image policy
        run: |
          test "$(docker image inspect resolver-identity-rust:ci --format '{{.Config.User}}')" = resolver-rust
          for binary in ri-agent ri-wrapper ri-trace-adapter ri-registry-sync ri-knot-trace-producer; do
            docker run --rm --entrypoint /bin/sh resolver-identity-rust:ci -c "test -x /usr/local/bin/$binary"
          done

  knot-trace-image:
    runs-on: ubuntu-24.04
    needs: [rust, field-delivery]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --pull --file docker/Dockerfile.knot-trace --tag resolver-identity-knot-trace:ci .
      - name: Verify pinned real Resolver image
        run: |
          test "$(docker image inspect resolver-identity-knot-trace:ci --format '{{.Config.User}}')" = 10003:10003
          docker run --rm --entrypoint /bin/sh resolver-identity-knot-trace:ci -c \
            "ldd /usr/sbin/kresd | tee /tmp/kresd-ldd && ! grep -q 'not found' /tmp/kresd-ldd"
          docker run --rm --entrypoint /usr/sbin/kresd resolver-identity-knot-trace:ci -V 2>&1 |
            grep -q 'Knot Resolver, version 6.3.0'
          container="$(docker create resolver-identity-knot-trace:ci)"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/sbin/kresd" /tmp/kresd-trace
          grep -a -q 'RI_KNOT_TRACE_HOOK_SOCKET' /tmp/kresd-trace

  production-trace-evidence:
    runs-on: ubuntu-24.04
    needs: [rust, python, field-delivery]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate script-generated production Trace evidence
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from tools.manage_norn_field_delivery import _trace_acceptance_ready

          path = Path("specs/production-resolver-trace/acceptance.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          source = evidence["source_commit"]
          subprocess.run(["git", "cat-file", "-e", f"{source}^{{commit}}"], check=True)
          assert _trace_acceptance_ready(path, source)
          assert evidence["temporary_environment_cleaned"] is True
          assert evidence["production_trace_ready"] is True
          PY

  management-image:
    runs-on: ubuntu-24.04
    needs: [python, field-delivery]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --pull --file docker/Dockerfile.management --tag resolver-identity-management:ci .
      - name: Verify management image policy
        run: |
          test "$(docker image inspect resolver-identity-management:ci --format '{{.Config.User}}')" = resolver
          docker run --rm resolver-identity-management:ci --help
          docker run --rm --entrypoint /usr/local/bin/ri-nornctl resolver-identity-management:ci 2>&1 |
            grep -q 'usage: ri-nornctl'
          docker run --rm --entrypoint /bin/sh resolver-identity-management:ci \
            -c 'test ! -e /run/field-secrets && test ! -e /root/.ssh'

  full-rc-acceptance:
    name: full Go-Norn + Knot RC acceptance
    if: github.event_name == 'pull_request' && github.head_ref == 'release/norn-knot-rc1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [rust, python, solidity, compose, field-delivery, knot-trace-image, management-image]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: release/norn-knot-rc1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install fixed acceptance dependencies
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck=0.9.0-1 sqlite3
          install -d "$HOME/.docker/cli-plugins"
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v5.0.0/docker-compose-linux-x86_64 \
            --output "$HOME/.docker/cli-plugins/docker-compose"
          echo '5091bac5729ce968c602d157c2f0b959b7b367d4efb70aa864eb9ae78eebe13e  /home/runner/.docker/cli-plugins/docker-compose' |
            sha256sum --check --strict
          chmod 0755 "$HOME/.docker/cli-plugins/docker-compose"
          test "$(docker compose version --short)" = "5.0.0"
      - name: Build isolated real Knot acceptance runner
        run: |
          docker build --pull \
            --file docker/Dockerfile.knot-trace \
            --tag resolver-identity-knot-trace:rc-acceptance .
          cat >"$RUNNER_TEMP/Dockerfile.trace-acceptance" <<'EOF'
          FROM rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073 AS rust-toolchain
          FROM resolver-identity-knot-trace:rc-acceptance
          USER 0:0
          RUN apt-get update \
              && apt-get install --yes --no-install-recommends \
                 build-essential ca-certificates cmake git knot knot-dnsutils \
                 pkgconf python3 python3-pytest \
              && rm -rf /var/lib/apt/lists/*
          COPY --from=rust-toolchain /usr/local/cargo /usr/local/cargo
          COPY --from=rust-toolchain /usr/local/rustup /usr/local/rustup
          ENV PATH=/usr/local/cargo/bin:/usr/local/rustup/bin:$PATH \
              RUSTUP_HOME=/usr/local/rustup \
              CARGO_HOME=/usr/local/cargo
          ENTRYPOINT []
          EOF
          docker build \
            --file "$RUNNER_TEMP/Dockerfile.trace-acceptance" \
            --tag resolver-identity-knot-trace-acceptance:rc1 .
      - name: Generate real Knot Trace evidence
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env CARGO_HOME=/tmp/cargo \
            --env RUSTUP_HOME=/usr/local/rustup \
            --volume "$PWD:/workspace" \
            --volume "$RUNNER_TEMP:/evidence" \
            --workdir /workspace \
            resolver-identity-knot-trace-acceptance:rc1 \
            python3 tools/run_production_trace_acceptance.py \
              --kresd /usr/sbin/kresd \
              --knotd /usr/sbin/knotd \
              --kdig /usr/bin/kdig \
              --concurrency 128 \
              --output /evidence/production-resolver-trace.json
      - name: Run six-server field package acceptance
        run: |
          scripts/field-delivery/run-acceptance.sh \
            --trace-acceptance "$RUNNER_TEMP/production-resolver-trace.json"
      - name: Run clean Go-Norn multichain acceptance
        env:
          NORN_CLEAN_BUILD: "true"
        run: |
          cleanup() { scripts/norn/99-stop.sh || true; }
          trap cleanup EXIT
          scripts/norn/00-build.sh
          scripts/norn/01-initialize.sh
          scripts/norn/02-start.sh
          scripts/norn/03-prepare-snapshot.sh
          scripts/norn/04-publish-and-sync.sh
          scripts/norn/05-negative-tests.sh
          scripts/norn/06-finalize-acceptance.sh
          scripts/norn/99-stop.sh
          trap - EXIT
      - name: Finalize integrated evidence
        run: |
          install -m 0644 "$RUNNER_TEMP/production-resolver-trace.json" \
            specs/production-resolver-trace/acceptance.json
          source_commit="$(git rev-parse HEAD)"
          python3 tools/finalize_norn_knot_rc.py finalize \
            --source-commit "$source_commit" \
            --release-root artifacts/field-deployment/0.3.0-norn-knot-rc1 \
            --output specs/norn-knot-rc1
          git diff --check
          test "$(jq -r .source_commit specs/norn-knot-rc1/test-summary.json)" = "$source_commit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: norn-knot-rc1-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/field-deployment/0.3.0-norn-knot-rc1
            specs/multichain-registry-adapter/acceptance.json
            specs/norn-field-delivery/acceptance.json
            specs/production-resolver-trace/acceptance.json
            specs/norn-knot-rc1

  integration-evidence:
    runs-on: ubuntu-24.04
    needs: [python, field-delivery, production-trace-evidence]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify integrated RC evidence boundary
        run: |
          rc_source_commit="dca8887eadf85a1575a6fe6c4c7dafb3f9ec27e5"
          rc_evidence_commit="a4d4b648edbfbe1857533d4dcdb7517d124c2a81"
          test "$(jq -r .source_commit specs/norn-knot-rc1/test-summary.json)" = "$rc_source_commit"
          test "$(jq -r .git_commit specs/norn-knot-rc1/release-manifest.json)" = "$rc_source_commit"
          git cat-file -e "${rc_source_commit}^{commit}"
          git cat-file -e "${rc_evidence_commit}^{commit}"
          python3 tools/finalize_norn_knot_rc.py verify-evidence-diff \
            --source-commit "$rc_source_commit" \
            --evidence-commit "$rc_evidence_commit"
          jq -e '
            .release_version == "0.3.0-norn-knot-rc1" and
            .deployment.production_trace_ready == true and
            .deployment.field_package_ready == true and
            .deployment.real_server_deployed == false and
            .deployment.production_traffic_enabled == false and
            .security_audit.secrets_found == false
          ' specs/norn-knot-rc1/test-summary.json >/dev/null

  easy-installer-evidence:
    name: easy installer evidence
    runs-on: ubuntu-24.04
    needs: [easy-installer]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify easy installer evidence boundary
        run: |
          source_commit="$(jq -r .source_commit specs/domain-center-easy-install/test-summary.json)"
          evidence_commit="$(git rev-parse HEAD)"
          git cat-file -e "${source_commit}^{commit}"
          git cat-file -e "${evidence_commit}^{commit}"
          python3 tools/finalize_domain_center_easy_install.py verify-evidence-diff \
            --source-commit "$source_commit" \
            --evidence-commit "$evidence_commit"
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          source = json.loads(Path("specs/domain-center-easy-install/test-summary.json").read_text(encoding="utf-8"))
          source_commit = source["source_commit"]
          assert subprocess.run(
              ["git", "merge-base", "--is-ancestor", source_commit, "HEAD"],
              check=False,
          ).returncode == 0
          delivery = Path(source["delivery"]["path"])
          evidence = json.loads((delivery / "证据.json").read_text(encoding="utf-8"))
          assert evidence["source_commit"] == source_commit
          assert evidence["release_ready"] is False
          assert evidence["real_server_deployed"] is False
          assert evidence["production_traffic_enabled"] is False
          manifest = json.loads((delivery / "01-发布信息" / "release-manifest.json").read_text(encoding="utf-8"))
          assert manifest["source_commit"] == source_commit
          assert manifest["real_server_deployed"] is False
          assert manifest["production_traffic_enabled"] is False
          for relative in ("images.lock.json", "docker-runtime-acceptance.json", "oci-acceptance.json", "recipient-verification.json"):
              record = json.loads((Path("specs/domain-center-easy-install") / relative).read_text(encoding="utf-8"))
              assert record["source_commit"] == source_commit
          assets = json.loads(Path("specs/domain-center-easy-install/release-assets.json").read_text(encoding="utf-8"))
          assert assets["source_commit"] == source_commit
          assert assets["storage"] == "github-release-assets-only"
          assert assets["release_ready"] is False
          assert assets["real_server_deployed"] is False
          assert assets["production_traffic_enabled"] is False
          asset_map = {item["filename"]: item for item in assets["assets"]}
          expected_assets = {
              "acceptance-mgmt.tar.gz", "acceptance-norn-a.tar.gz", "acceptance-norn-b.tar.gz",
              "acceptance-r1.tar.gz", "acceptance-r2.tar.gz", "acceptance-r3.tar.gz",
              "go-norn.oci.tar", "knot-trace.oci.tar", "management.oci.tar",
              "mtls-read-proxy.oci.tar", "resolver-identity-domain-center-easy-install-0.3.0-norn-knot-rc1.tar.zst",
              "rust-data-plane.oci.tar",
          }
          assert set(asset_map) == expected_assets
          for item in asset_map.values():
              assert isinstance(item["size"], int) and item["size"] > 0
              assert len(item["sha256"]) == 64 and all(c in "0123456789abcdef" for c in item["sha256"])
          for line in Path("artifacts/domain-center/OFFLINE-SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, relative = line.split(None, 1)
              path = Path(relative)
              if path.is_file():
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert actual == digest, relative
              else:
                  assert path.name in asset_map
                  assert asset_map[path.name]["sha256"] == digest
          host_archives = json.loads((delivery / "12-验收证据" / "host-archives.json").read_text(encoding="utf-8"))
          for host in host_archives["hosts"]:
              filename = Path(host["archive"]).name
              assert asset_map[filename]["sha256"] == host["sha256"]
          lock = json.loads(Path("specs/domain-center-easy-install/images.lock.json").read_text(encoding="utf-8"))
          for image in lock["images"]:
              assert asset_map[image["archive"]]["sha256"] == image["archive_sha256"]
              assert asset_map[image["archive"]]["manifest_digest"] == image["manifest_digest"]
          assert not list(Path("artifacts/domain-center").rglob("*.oci.tar"))
          assert not list(Path("artifacts/domain-center").rglob("*.tar.gz"))
          assert not list(Path("artifacts/domain-center").rglob("*.tar.zst"))
          assert all(
              not path.name.endswith((".oci.tar", ".tar.gz", ".tar.zst"))
              for path in Path("specs/domain-center-easy-install").rglob("*")
              if path.is_file()
          )
          PY

  release-candidate-gate:
    name: release candidate gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [rust, python, solidity, compose, field-delivery, easy-installer, easy-installer-evidence, legacy-python-image, rust-production-image, knot-trace-image, production-trace-evidence, management-image, integration-evidence, full-rc-acceptance]
    steps:
      - name: Require every release-candidate check
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          SOLIDITY_RESULT: ${{ needs.solidity.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          FIELD_RESULT: ${{ needs.field-delivery.result }}
          EASY_INSTALLER_RESULT: ${{ needs.easy-installer.result }}
          EASY_INSTALLER_EVIDENCE_RESULT: ${{ needs.easy-installer-evidence.result }}
          LEGACY_IMAGE_RESULT: ${{ needs.legacy-python-image.result }}
          RUST_IMAGE_RESULT: ${{ needs.rust-production-image.result }}
          KNOT_IMAGE_RESULT: ${{ needs.knot-trace-image.result }}
          TRACE_EVIDENCE_RESULT: ${{ needs.production-trace-evidence.result }}
          MANAGEMENT_IMAGE_RESULT: ${{ needs.management-image.result }}
          INTEGRATION_EVIDENCE_RESULT: ${{ needs.integration-evidence.result }}
          FULL_RC_ACCEPTANCE_RESULT: ${{ needs.full-rc-acceptance.result }}
          REQUIRE_FULL_RC_ACCEPTANCE: ${{ github.event_name == 'pull_request' && github.head_ref == 'release/norn-knot-rc1' }}
        run: |
          for result in \
            "$RUST_RESULT" "$PYTHON_RESULT" "$SOLIDITY_RESULT" "$COMPOSE_RESULT" \
            "$FIELD_RESULT" "$EASY_INSTALLER_RESULT" "$EASY_INSTALLER_EVIDENCE_RESULT" "$LEGACY_IMAGE_RESULT" "$RUST_IMAGE_RESULT" \
            "$KNOT_IMAGE_RESULT" "$TRACE_EVIDENCE_RESULT" "$MANAGEMENT_IMAGE_RESULT" \
            "$INTEGRATION_EVIDENCE_RESULT"; do
            test "$result" = success
          done
          if [[ "$REQUIRE_FULL_RC_ACCEPTANCE" == "true" ]]; then
            test "$FULL_RC_ACCEPTANCE_RESULT" = success
          else
            test "$FULL_RC_ACCEPTANCE_RESULT" = skipped
          fi
